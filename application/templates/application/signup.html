{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 - Learn Chinese</title>
  <link rel="stylesheet" href="{% static 'application/style.css' %}" />
  <link rel="stylesheet" href="{% static 'application/signup.css' %}" />
</head>
<body>
  <nav class="nav">
    <a href="{% url 'index' %}"><img class="logo-img" src="{% static 'application/images/logo.png' %}" alt="Learn Chinese Logo" /></a>
    <div class="menu">
      <a href="{% url 'index' %}">主页</a>
      <a href="{% url 'course' %}">课程</a>
      <a href="{% url 'quiz' %}">测验</a>
      <a href="{% url 'about' %}">关于</a>
      <a href="{% url 'login' %}">登录</a>
    </div>
  </nav>

  <main>
    <form method="post" class="signup-card">
      {% csrf_token %}
      <h2>创建账户</h2>
      {{ form.non_field_errors }}
      <label>用户名</label>
      {{ form.username }}
      <label>邮箱</label>
      {{ form.email }}
      <label>学习目标</label>
      {{ form.goal }}
      <label>偏好语言</label>
      {{ form.preferred_language }}
      <label>密码</label>
      {{ form.password1 }}
      <label>确认密码</label>
      {{ form.password2 }}
      <button type="submit">注册</button>
      <p>已有账户？<a href="{% url 'login' %}">立即登录</a></p>
    </form>
  </main>
</body>
</html>
